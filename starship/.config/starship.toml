add_newline = true

# Minimal, calm, left-aligned
format = "$directory$git_branch$character"
# palette = "reverse_void"
# palette = "kanagawa"
# palette = "lackluster"
# palette = "vague"
palette = "koda"
# palette = "catppuccin_mocha"

[character]
# success_symbol = "[❯](ink)"
# error_symbol   = "[❯](error)"
success_symbol = "[λ](ink)"
error_symbol   = "[λ](error)"
# success_symbol = "[❯](oni_violet)"
# error_symbol   = "[❯](wave_red)"
# success_symbol = "λ"
# error_symbol   = "λ"

[directory]
format = "[$path ]($style)"
style = "ink"
# style = "crystal_blue"

[directory.substitutions]

[git_branch]
symbol = " "
format = '[$symbol$branch ]($style)'
style = "faded"
# style = "oni_violet"

[git_status]
format = "[($all_status$ahead_behind)]($style)"
style = "warn"
# style = "carp_yellow"

[bun]
disabled = true
symbol = "🥟 "
format = '[$symbol]($style)'
style = "error"
detect_files = ['bun.lock', 'bun.lockb', 'bunfig.toml']

[rust]
disabled = true
symbol = "🦀 "
format = '[$symbol]($style)'
style = "error"
# style = "samurai_red"
detect_extensions = ['rs']
detect_files = ['Cargo.toml']

[docker_context]
disabled = true
symbol = "🐳 "
format = "[$context ]($style)"
style = "muted"

[cmd_duration]
disabled = true

[c]
disabled = true
symbol = "C "
format = '[$symbol]($style)'
style = "error"
detect_extensions = ['c', 'h']
commands = [ [ 'cc', '--version' ], [ 'gcc', '--version' ], [ 'clang', '--version' ] ]

[cpp]
disabled = true
symbol = "C++ "
format = '[$symbol]($style)'
style = "error"
detect_extensions = ['cpp', 'cc', 'cxx', 'c++', 'hpp', 'hh', 'hxx', 'h++', 'tcc']
commands = [ [ 'c++', '--version' ], [ 'g++', '--version' ], [ 'clang++', '--version' ] ]

[python]
disabled = true
symbol = "🐍 "
format = '[$symbol]($style)'
style = "muted"
detect_extensions = ['py', 'ipynb']

[kubernetes]
disabled = true
symbol = "☸ "
format = '[$symbol]($style)'
style = "muted"

[aws]
disabled = true
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
style = 'muted'
symbol = " "

[nodejs]
disabled = true

[conda]
disabled = true

[os]
disabled = true

# =========================
# 🎨 Reverse Void Palette
# =========================

[palettes.reverse_void]
ink        = "#1F1F1F"
faded      = "#6B6B6B"
muted      = "#8A8A8A"
warn       = "#9C7C38"
error      = "#8C3A3A"
background = "#F6F4EE"

# =========================
# 🎨 Vague Palette
# =========================

[palettes.vague]
ink        = "#D4BD98"
faded      = "#787BAB"
muted      = "#BC96B0"
warn       = "#606079"
error      = "#E8788A"
background = "#161616"

# =========================
# 🎨 Lackluster Palette
# =========================

[palettes.lackluster]
ink        = "#FFAA88"   # primary text (soft white)
faded      = "#708090"   # blue-gray (secondary text)
muted      = "#555555"   # base gray
warn       = "#7788AA"   # muted blue (calm warning)
error      = "#CCCCCC"   # soft red/orange
background = "#1A1A1A"   # dark neutral bg (not pure black)

# =========================
# 🎨 Lackluster Palette
# =========================

[palettes.koda]
ink        = "#b0b0b0"   # primary text (soft white)
faded      = "#7393B3"   # blue-gray (secondary text)
muted      = "#7AA89F"   # base gray
warn       = "#d4b878"   # muted blue (calm warning)
error      = "#c4746e"   # soft red/orange
background = "#1A1A1A"   # dark neutral bg (not pure black)


